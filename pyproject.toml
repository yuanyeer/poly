[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket CLOB paper-trading arbitrage bot (no real-money orders)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "poly" }]
dependencies = [
    "py-clob-client-v2==1.1.0",
    "PyYAML==6.0.2",
    "python-dotenv==1.1.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[project.scripts]
poly-paper = "polybot.runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
