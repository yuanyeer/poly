# Paper-only copy-trading observation. Referenced from config/paper.yaml.
# Encodes poly 算法 v1: docs/copy_follow_rules.md.
# No live orders. No fabricated fills. Display names are config keys until
# wallet address mapping is resolved (TODO).
# 负责人 CONFIRMED 24h trading. Paper loop may scan 24h; no ET session gate.

enabled: true

# Copy sleeve vs paper equity. Cannot exceed 30%.
# Existing risk caps still apply on top of this:
#   single trade ≤ 25% of cash, same event ≤ 40% of cash, ≤ 3 concurrent.
max_sleeve_pct: 0.30

# Mirror chase (算法 v1): after delay Δt, walk our book; fill_px = VWAP;
# fee per fd; abandon if |fill_px − leader_px| + fee/share > 0.01 (1¢).
# Cannot be loosened above 1¢.
max_chase_slippage: 0.01

stop_follow:
  # Fire STOP_FOLLOW + RESCAN_NEEDED when any trigger trips (算法 v1).
  # Thresholds cannot be raised (that would loosen the stop).
  peak_dd: 0.05          # leader peak drawdown ≥ 5%
  path_dd: 0.05          # leader path drawdown ≥ 5%
  month_pnl_below: 0     # stop when month_pnl ≤ 0

# Optional JSON stub for paper tests / offline observation.
# A later scanner can replace JsonFileMetricsProvider. Not a live scraper.
# metrics_stub: data/copy_metrics.json

# Priority order (1 = first). Primary leader is the default follow.
# TODO: resolve Polymarket wallet / proxy-wallet addresses for these keys.
leaders:
  - id: "x-MoneyForWhiskas"
    label: "x-MoneyForWhiskas"
    strategy_tag: BTC_5m
    priority: 1
    primary: true
    wallet: null
  # Quoted: unquoted 0x… is a YAML hex integer (would become 881278155897).
  - id: "0xcd30457c79"
    label: "0xcd30457c79"
    strategy_tag: BTC_5m
    priority: 2
    primary: false
    wallet: null
  - id: "goldfisherrr"
    label: "goldfisherrr"
    strategy_tag: BTC_15m
    priority: 3
    primary: false
    wallet: null
