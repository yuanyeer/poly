# Hard constraints for paper mode. The loader rejects any attempt to loosen
# position caps or edge floors below the values encoded here and in code.

mode: paper

ledger:
  starting_balance_usd: 200
  target_balance_usd: 1000
  path: data/paper_ledger.jsonl

endpoints:
  clob_host: https://clob.polymarket.com
  gamma_host: https://gamma-api.polymarket.com
  chain_id: 137

scan:
  max_markets: 36
  poll_interval_seconds: 20
  clob_pages: 3
  include_gamma: true
  max_complete_set_events: 10
  max_complete_set_outcomes: 12
  size_probe_steps: 8
  summary_every_cycles: 1
  # Screen many books with batch asks; only walk when 1-Σbest_ask can clear the floor.
  skip_walk_if_raw_below_floor: true
  # Optional explicit condition IDs. Empty = discover via CLOB/Gamma.
  condition_ids: []

edge:
  # Net edge after fees, per share (price units).
  taker_floor: 0.005   # 0.5¢
  maker_floor: 0.002   # 0.2¢

risk:
  max_trade_notional_pct: 0.25
  max_same_event_exposure_pct: 0.40
  max_concurrent_open: 3
  # Maker residual unhedged notional allowed (USD). 0 = full hedge required.
  max_unhedged_inventory_usd: 0

fees:
  # fd.to is source of truth. When true, makers pay 0.
  # taker fee(p) = size * r * p * (1-p)
  assume_taker_only_if_fd_missing: true

min_fill_size: 1

# FINAL trading window from poly 负责人.
# Local wall clock in America/New_York; ZoneInfo honors DST (EST/EDT).
# timezone / start / end are YAML-only — edit here, no code change.
# (A later Shanghai 10:00–23:00 draft was cancelled; do not hardcode it.)
# Weekends use the same hours. Start is inclusive; scanning stops at end.
# Outside [start, end) --loop idles with SKIP session_closed (no scan).
# Not 24h trading.
# booked=0 streak = in-window cycles only. Overnight idle (end→next start)
# does NOT count — this is not a wall-clock 24h meter.
# Drawdown: live ledger equity vs peak on every cycle, including off-hours.
# Two tiers — do not collapse (ask poly金融):
#   escalate / REVIEW: peak DD ≥ 10% OR equity < 180 — continue scanning; do NOT hard-stop
#   hard halt / SKIP: peak DD ≥ 25% OR equity < 150 — stops trading
#   150 is intentionally below 180 so the floors do not collide
# booked=0 escalate still uses cumulative NY 08:00–23:00 window time only.
session:
  enabled: true
  timezone: America/New_York
  start: "08:00"
  end: "23:00"
  idle_zero_fill_sessions: 2
  drawdown_review_pct: 0.10
  drawdown_review_floor_usd: 180
  drawdown_halt_pct: 0.25
  drawdown_halt_floor_usd: 150

# Copy-trading observation (paper-only hooks). YES+NO / complete-set arb unchanged.
# Watchlist, stop-follow, and sleeve limits live in the referenced file.
# Loader rejects a sleeve above 30% or loosened stop-follow thresholds.
# No live orders. No fabricated fills. See docs/copy_trading.md.
copy:
  path: config/copy.yaml
