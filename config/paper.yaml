# Hard constraints for paper mode. The loader rejects any attempt to loosen
# position caps or edge floors below the values encoded here and in code.

mode: paper

# Finance freeze: each ledger starts 1000; first to 2000 wins (report only).
ledger:
  starting_balance_usd: 1000
  target_balance_usd: 2000
  path: data/paper_ledger.jsonl  # arb-main; copy ledgers are siblings copy-<leader>.jsonl

endpoints:
  clob_host: https://clob.polymarket.com
  gamma_host: https://gamma-api.polymarket.com
  chain_id: 137

scan:
  max_markets: 36
  poll_interval_seconds: 20
  clob_pages: 3
  include_gamma: true
  max_complete_set_events: 10
  max_complete_set_outcomes: 12
  size_probe_steps: 8
  summary_every_cycles: 1
  # Screen many books with batch asks; only walk when 1-Σbest_ask can clear the floor.
  skip_walk_if_raw_below_floor: true
  # Optional explicit condition IDs. Empty = discover via CLOB/Gamma.
  condition_ids: []

edge:
  # Net edge after fees, per share (price units).
  taker_floor: 0.005   # 0.5¢
  maker_floor: 0.002   # 0.2¢

risk:
  max_trade_notional_pct: 0.25
  max_same_event_exposure_pct: 0.40
  max_concurrent_open: 3
  # Maker residual unhedged notional allowed (USD). 0 = full hedge required.
  max_unhedged_inventory_usd: 0

fees:
  # fd.to is source of truth. When true, makers pay 0.
  # taker fee(p) = size * r * p * (1-p)
  assume_taker_only_if_fd_missing: true

min_fill_size: 1

# 24h / 00:00–24:00 ET (ops frozen). No ET session gate.
# session.enabled: false — --loop may scan 24h. Do not reintroduce an ET window.
# booked=0 escalate is wall-clock / calendar continuous 24h.
# Drawdown: live ledger equity vs peak on every cycle. Per-ledger.
# Two tiers — do not collapse (finance freeze / PR #10):
#   escalate / REVIEW: peak DD ≥ 10% OR equity < 900 — continue scanning; do NOT hard-stop
#   hard halt / SKIP: peak DD ≥ 25% OR equity < 750 — SKIP that ledger only
#   750 is intentionally below 900 so the floors do not collide
session:
  enabled: false
  idle_zero_fill_hours: 24
  drawdown_review_pct: 0.10
  drawdown_review_floor_usd: 900
  drawdown_halt_pct: 0.25
  drawdown_halt_floor_usd: 750

# Multi-ledger competition (isolated): arb-main + one copy ledger per watchlist
# leader. Cash / exposure / concurrent / sleeve / REVIEW / HARD are per-ledger.
# Copy-trading observation (paper-only hooks). YES+NO / complete-set arb unchanged.
# Watchlist, stop-follow, and sleeve limits live in the referenced file.
# Loader rejects a sleeve above 30% or loosened stop-follow thresholds.
# No live orders. No fabricated fills. See docs/copy_trading.md.
copy:
  path: config/copy.yaml
